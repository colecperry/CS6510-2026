# The other edge: nginx doing the job the Python gateway does, so the two can be measured against each other.
#
# A reverse proxy is a server that accepts a request and passes it to whichever machine actually answers it. That is the whole of edge/gateway/, written in Python, and the whole of this file, written as configuration for a program built for the job.
# Every path below is relative to edge/, because nginx is started with that as its prefix: nginx -p edge -c edge/nginx.conf. See scripts/start_all.sh --edge=nginx.

worker_processes  1;        # One, to match the single Python process the comparison is against.
error_log  ../logs/nginx-error.log warn;
pid        ../logs/nginx.pid;

events {
    worker_connections  2048;
}

http {
    access_log  off;        # The load client reports its own latencies, and writing a line per request would charge this edge for work the Python one is not doing.

    # Scratch space, pinned under logs/ so nginx never tries to write inside the Homebrew install it was started from.
    client_body_temp_path ../logs/nginx-tmp;
    proxy_temp_path       ../logs/nginx-tmp;
    fastcgi_temp_path     ../logs/nginx-tmp;
    uwsgi_temp_path       ../logs/nginx-tmp;
    scgi_temp_path        ../logs/nginx-tmp;

    # One pool of kept-open connections per service. Without these nginx opens a fresh TCP connection for every request, which at this rate costs more than the request itself.
    upstream checkout  { server 127.0.0.1:8081; keepalive 64; }
    upstream inventory { server 127.0.0.1:8082; keepalive 64; }
    upstream analytics { server 127.0.0.1:8083; keepalive 64; }

    server {
        listen       8080;
        server_name  localhost;

        # Longest matching prefix wins in nginx too, so these four cover exactly the seven public paths and nothing else.
        location /transactions { proxy_pass http://checkout;  include proxy.conf; }
        location /items        { proxy_pass http://inventory; include proxy.conf; }
        location /inventory    { proxy_pass http://inventory; include proxy.conf; }
        location /analytics    { proxy_pass http://analytics; include proxy.conf; }

        # Everything else, including the /internal paths services used to coordinate through before this week, gets the same 404 body the Python gateway returns, so a caller cannot tell the two edges apart.
        location / {
            default_type application/json;
            return 404 '{"error":"NOT_FOUND","message":"No such path"}';
        }
    }
}
