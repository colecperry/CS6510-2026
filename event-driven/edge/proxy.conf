# The proxy settings every route shares, kept in one file so the four location blocks stay one line each.
#
# Included by edge/nginx.conf. Nothing here is specific to a service: it is the handful of things nginx needs told before it will keep an upstream connection open and pass a request through unchanged.

# Keepalive is only honoured on HTTP/1.1, and nginx talks 1.0 to upstreams unless told otherwise. Without these two lines the upstream pools above are declared and never used.
proxy_http_version 1.1;
proxy_set_header Connection "";

# The services run Hypercorn with a hand-patched check that refuses the HTTP/2 upgrade, because accepting it makes them collapse under load. That patch lives in each service's serve.py and is carried from week 4. nginx never attempts the upgrade, so it is only the version above that matters here.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

# Long enough that a slow service shows up as a slow response rather than as an error the load client counts differently from the Python gateway's, which uses a 30 second httpx timeout.
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
