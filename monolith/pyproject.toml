[project]
name = "monolith"
version = "0.1.0"
description = "Week 1: monolithic self-checkout backend (FastAPI + Postgres)"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "hypercorn>=0.18.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
]
