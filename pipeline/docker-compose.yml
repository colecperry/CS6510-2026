services:
  postgres:
    image: postgres:16
    # One name per week, so all three can exist at once. Container names are global to the Docker daemon, so reusing another week's name would make whichever started second fail outright.
    container_name: self-checkout-db-pipeline
    environment:
      POSTGRES_USER: checkout
      POSTGRES_PASSWORD: checkout
      POSTGRES_DB: self_checkout
    # Host port 5435: 5432 is any local Postgres install, 5433 is week 1's, 5434 is week 2's.
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Default max_connections (100) is too low for our pool (up to 120, sized for stress mode's 100 stations) - raised with headroom.
    command: postgres -c max_connections=200

volumes:
  pgdata:
